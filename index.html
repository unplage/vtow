<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#1e293b">
    <title>语音转写 · 会议版 (PWA)</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app-container">

        <!-- Header -->
        <div class="header">
            <div class="header-top">
                <h1><i class="fas fa-microphone-lines"></i> <span data-i18n="appTitle">语音转写·会议版</span></h1>
                <div class="header-actions">
                    <span class="online-indicator" id="onlineStatus">在线</span>
                    <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
                </div>
            </div>
            <div class="lang-selector" id="langSelector">
                <button class="lang-option active" data-lang="zh-CN">🇨 中文</button>
                <button class="lang-option" data-lang="en-US">🇬🇧 英文</button>
            </div>
        </div>

        <!-- Live transcript -->
        <div class="live-card">
            <div class="transcript-label"><i class="far fa-clock"></i> <span data-i18n="liveLabel">实时记录（带时间戳）</span></div>
            <div id="segmentList" class="segment-list">
                <div class="live-placeholder">点击开始，对着麦克风说话...</div>
            </div>
            <div class="audio-meter" id="audioMeter"></div>
            <div class="status-badge" id="statusBadge"><i class="fas fa-circle"></i> <span data-i18n="statusIdle">空闲</span></div>
        </div>

        <!-- Controls -->
        <div class="control-panel">
            <button class="ctrl-btn primary" id="startBtn"><i class="fas fa-play"></i> <span data-i18n="btnStart">开始</span></button>
            <button class="ctrl-btn" id="pauseBtn" disabled><i class="fas fa-pause"></i></button>
            <button class="ctrl-btn danger" id="stopBtn" disabled><i class="fas fa-stop"></i> <span data-i18n="btnStop">停止</span></button>
        </div>

        <!-- Model selector -->
        <div class="model-selector" id="modelSelector">
            <button class="model-option" data-model="Xenova/whisper-tiny">Tiny</button>
            <button class="model-option active" data-model="Xenova/whisper-base">Base</button>
            <button class="model-option" data-model="Xenova/whisper-small">Small</button>
            <button class="model-option" data-model="Xenova/whisper-large-v3-turbo">Turbo</button>
        </div>
        <div class="model-status" id="modelStatus">⚡ <span data-i18n="modelLoading">模型加载中</span>...</div>

        <!-- Upload -->
        <div class="upload-area" id="uploadArea">
            <i class="fas fa-cloud-upload-alt"></i>
            <p data-i18n="uploadHint">点击或拖拽上传音频文件</p>
            <p class="small" data-i18n="uploadFormats">支持 mp3 / wav / m4a / webm / ogg</p>
            <div id="progressContainer" class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <input type="file" id="fileInput" accept="audio/*,.webm,.mp3,.wav,.m4a,.ogg,.flac">
            <div class="cache-control"><a id="clearCacheBtn" data-i18n="clearCache">❌ 清除缓存并重试</a></div>
        </div>

        <!-- Keyboard shortcuts -->
        <div class="shortcut-bar">
            <span>Space 开始/停止</span>
            <span>Ctrl+E 导出</span>
            <span>Ctrl+F 搜索</span>
            <span>Ctrl+T 主题</span>
        </div>

        <!-- History -->
        <div class="history-section">
            <div class="history-header">
                <h2><i class="far fa-save"></i> <span data-i18n="historyTitle">历史记录</span></h2>
            </div>
            <div class="history-toolbar">
                <input type="text" class="search-input" id="searchInput" placeholder="搜索转写内容...">
                <button class="toolbar-btn" id="exportAllBtn"><i class="fas fa-download"></i> 全部导出</button>
            </div>
            <div class="history-list" id="historyList"></div>
            <div class="history-empty" id="historyEmpty">暂无转写记录</div>
            <div class="history-pagination" id="historyPagination"></div>
        </div>

    </div>

    <div id="toast"></div>

    <div id="downloadModal" class="modal-overlay hidden">
      <div class="modal-dialog">
        <div class="modal-header" id="downloadModalHeader">⚠️ 下载模型</div>
        <div class="modal-body" id="downloadModalBody"></div>
        <div class="modal-progress-area hidden" id="downloadProgressArea">
          <div class="progress-bar modal-progress-bar">
            <div class="progress-fill" id="downloadProgressFill"></div>
          </div>
          <div class="progress-text" id="downloadProgressText">准备中...</div>
        </div>
        <div class="modal-footer" id="downloadModalFooter">
          <button class="ctrl-btn" id="downloadCancelBtn">取消</button>
          <button class="ctrl-btn primary" id="downloadConfirmBtn">继续下载</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/app.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(reg => {
          console.log('Service Worker registered, scope:', reg.scope);
        }).catch(err => {
          console.error('Service Worker registration failed:', err);
        });
      }
    </script>
</body>
</html>
